name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:migrations
      - run: pnpm build
      - name: Prepare browser
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - run: pnpm e2e:ci
      - uses: actions/upload-artifact@v4
        with:
          name: baby-english-web
          path: apps/mobile/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=manual --config apps/edge/supabase/functions/deno.json apps/edge/supabase/functions/coach/index.ts apps/edge/supabase/functions/transcribe/index.ts
